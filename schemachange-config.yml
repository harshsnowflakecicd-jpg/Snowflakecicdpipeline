config-version: 1
 
root-folder: migrations
modules-folder: null
 
# Where schemachange records which scripts have run (created on first deploy)
change-history-table: DEPLOY_META.SCHEMACHANGE.CHANGE_HISTORY
create-change-history-table: true
 
# Variables available inside SQL scripts (the pipeline overrides env per environment)
vars:
  env: DEV
 
autocommit: false
verbose: false
